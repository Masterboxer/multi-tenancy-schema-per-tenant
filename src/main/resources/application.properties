#######################
# Application
#######################
spring.application.name=spring-boot-multi-tenancy
server.port=8081
#######################
# Datasource: ONE shared pool for all tenants (schema is switched per connection checkout)
#######################
spring.datasource.url=jdbc:postgresql://localhost:5432/multi-tenancy
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
# Hikari resets a connection to this schema whenever it is returned to the pool
spring.datasource.hikari.schema=public
#######################
# JPA / Hibernate
#######################
spring.jpa.open-in-view=false
# Tables live in the tenant schemas (create them with SQL/Flyway), never auto-create them in public
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
# No tenant exists at startup, so do not let Hibernate open a connection just to inspect metadata
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#######################
# Tenants
#######################
app.schemas=apple,google,amazon
#######################
# JWT (secret MUST come from the environment, at least 32 characters; app refuses to start without it)
#######################
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=multi-tenancy-app
app.jwt.ttl=30m
#######################
# DEMO users (replace with a real user store / identity provider)
# alice@apple: Apple-Admin-2026!   bob@apple: Apple-User-2026!   carol@google: Google-Admin-2026!
#######################
app.auth.users[0].tenant=apple
app.auth.users[0].username=alice
app.auth.users[0].password-hash={bcrypt}$2b$10$GLH7m86bKjPEc9sH.6cVy.qrjYYmPFfubfAjBN019AJIRA7u8kEEu
app.auth.users[0].roles=USER,ADMIN
app.auth.users[1].tenant=apple
